    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DDD6FE"/><stop offset="1" stop-color="#99F6E4"/>
    </linearGradient>
    <linearGradient id="gStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".45"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="26"/></clipPath>
  </defs>

