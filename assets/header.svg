<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Tanjil Ahmed, Full-Stack Software Engineer">
  <title>Tanjil Ahmed, Full-Stack Software Engineer</title>
  <style>
    .tw { animation: tw 5s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
    .a1, .a2, .a3 { transform-box: fill-box; transform-origin: center; }
    .a1 { animation: d1 22s ease-in-out infinite alternate; }
    .a2 { animation: d2 26s ease-in-out infinite alternate; }
    .a3 { animation: d3 30s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(140px, 40px) scale(1.15); } }
    @keyframes d2 { to { transform: translate(-160px, -30px) scale(0.9); } }
    @keyframes d3 { to { transform: translate(90px, -50px) scale(1.2); } }
    .bob { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    .up { animation: up 1.2s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes up { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: none } }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity:.35 } 50% { opacity:.7 } }
    .line { transform-box: fill-box; transform-origin: left; animation: draw 1.6s .9s ease backwards; }
    @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
