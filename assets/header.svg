<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Tanjil Ahmed, Full-Stack Software Engineer. 2+ years at Technext Limited, 2 IEEE papers, Codeforces 1678.">
  <title>Tanjil Ahmed, Full-Stack Software Engineer</title>
  <style>
    .tw { animation: tw 5s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.9 } }
    .a1, .a2, .a3 { transform-box: fill-box; transform-origin: center; }
    .a1 { animation: d1 22s ease-in-out infinite alternate; }
    .a2 { animation: d2 26s ease-in-out infinite alternate; }
    .a3 { animation: d3 30s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(120px, 40px) scale(1.15); } }
    @keyframes d2 { to { transform: translate(-140px, -30px) scale(.9); } }
    @keyframes d3 { to { transform: translate(80px, -40px) scale(1.2); } }
    .bob { animation: bob 7s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
    .shadow { transform-box: fill-box; transform-origin: center; animation: sh 7s ease-in-out infinite; }
    @keyframes sh { 0%,100% { transform: translateY(0) scale(1); opacity:.45 } 50% { transform: translateY(12px) scale(.82); opacity:.25 } }
    .spin { transform-origin: 168px 140px; animation: spin 14s linear infinite; }
    .spinr { transform-origin: 168px 140px; animation: spin 22s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .breath { transform-origin: 168px 140px; animation: br 6s ease-in-out infinite; }
    @keyframes br { 0%,100% { opacity:.45; transform: scale(1) } 50% { opacity:.8; transform: scale(1.06) } }
    .up { animation: up 1.2s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes up { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform:none } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
